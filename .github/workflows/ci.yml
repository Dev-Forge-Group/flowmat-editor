name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # The package Node and Vitest load: both entries must import without a bundler.
      - run: npm run build
      - run: node -e "Promise.all([import('./dist/index.js'), import('./dist/react/index.js')]).then(() => console.log('entries load'))"
