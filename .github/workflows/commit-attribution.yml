name: Commit Attribution

# Keep AI coding assistants out of the GitHub contributor list: reject commits whose
# author, committer or Co-authored-by trailer is a Claude/Anthropic or Codex/OpenAI identity.
on:
  pull_request:
  push:
    branches: [ main, develop ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject AI assistant authors and co-author trailers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BASE_SHA" =~ ^0+$ ]] && git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            range=("$BASE_SHA..$HEAD_SHA")
          else
            range=(-1 "$HEAD_SHA")
          fi
          found=$(git log --format='%h%x09author: %an <%ae>%x09committer: %cn <%ce>%x09co-authors: %(trailers:key=Co-authored-by,valueonly,separator=%x2C )' "${range[@]}" \
            | grep -iE 'claude|anthropic|codex|openai|chatgpt' || true)
          if [ -n "$found" ]; then
            echo "::error::AI assistant identity in commit metadata. Remove the Co-authored-by trailer or re-author these commits (see AGENTS.md)."
            printf '%s\n' "$found"
            exit 1
          fi
          echo "No AI assistant authors or co-author trailers in ${range[*]}."
